# Portable manual tmux configuration. Nothing here starts tmux automatically.
set -g default-terminal "tmux-256color"
set -g history-limit 100000
set -g mouse on
set -g focus-events on
set -g set-clipboard on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -g set-titles on
set -g status-position bottom
set -g status-justify left
set -g status-left-length 30
set -g status-right-length 60
set -g status-left "#[bold]#h "
set -g status-right "#{pane_current_path} | %Y-%m-%d %H:%M"
set -g status-style "bg=colour234,fg=colour250"
set -g window-status-current-style "bold,bg=colour39,fg=colour16"
set -g window-status-current-format " #I:#W "
set -g window-status-format " #I:#W "
set -g message-style "bg=colour39,fg=colour16"

setw -g automatic-rename on
setw -g aggressive-resize on

bind c new-window -a -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display-message "tmux reloaded"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
