#### Generated baseline from ~/tmux-g.md

# Shell and terminal behavior
set-option -g default-shell /bin/zsh
set-option -g default-command ''
set-option -g default-terminal 'tmux-256color'
set-option -ga terminal-overrides ',*:Tc'
set-option -g default-size 80x24
set-option -g history-limit 3000
set-option -g destroy-unattached off
set-option -g detach-on-destroy off
set-option -g renumber-windows off

# Input
set-option -g prefix C-b
set-option -g prefix2 None
set-option -g status-keys vi
set-option -g mouse on
set-option -g window-style 'bg=default'
set-option -g window-active-style 'bg=default'
set-option -g repeat-time 500
set-option -g initial-repeat-time 0

# Messages and panes
set-option -g display-panes-active-colour red
set-option -g display-panes-colour blue
set-option -g display-panes-time 1000
set-option -g display-time 750
set-option -g message-style 'bg=default,fg=#f4ce73'
set-option -g message-command-style 'bg=default,fg=#f4ce73'

# Status bar
set-option -g status on
set-option -g status-position bottom
set-option -g status-interval 1
set-option -g status-justify left
set-option -g status-left '[#{session_name}] '
set-option -g status-left-length 10
set-option -g status-right '#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,} %H:%M:%S %d-%b-%y'
set-option -g status-right-length 40
set-option -g status-style 'bg=default,fg=#f4ce73'
set-option -g status-bg default
set-option -g status-fg '#f4ce73'

# Window titles
set-option -g set-titles off
set-option -g set-titles-string '#S:#I:#W - "#T" #{session_alerts}'
set -g base-index 1
setw -g pane-base-index 1

# Alerts
set-option -g bell-action any
set-option -g silence-action other
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off

# Copy mode
unbind -T copy-mode-vi MouseDragEnd1Pane
unbind -T copy-mode MouseDragEnd1Pane
set -g set-clipboard on

# Autostart Hooks
set-hook -g after-new-session {
	new-window -t 2 -n "nvim" "nvim"
	new-window -t 9 -n "btop" "btop"
	select-window -t 1
}
